<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening — IELTS Practice · 90 Practices</title>
<style>
:root{
  --forest:#013220;--moss:#006D6F;--teal:#007A74;--mint:#D8BFD8;--sage:#F5F5DC;
  --sand:#FFFAF0;--shell:#FFF5EE;--white:#FFFAFA;
  --blue:#2563EB;--blue-light:#EFF6FF;--amber:#D97706;--amber-light:#FFFBEB;
  --flash:#edc919;                 /* evidence highlight — blink colour */
  --red:#DC2626;--red-light:#FEF2F2;--green-success:#16A34A;--green-light:#F0FDF4;
  --text-dark:#013220;--text-mid:#006D6F;--text-soft:#5F8A80;
  --border:#E3DED0;--shadow-sm:0 1px 3px rgba(1,50,32,.08);--shadow-md:0 4px 16px rgba(1,50,32,.12);
  --shadow-lg:0 8px 32px rgba(1,50,32,.16);--radius:12px;--radius-sm:8px;--radius-lg:20px;font-size:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text-dark);line-height:1.6;background:var(--sand);}
.app-shell{display:flex;}
/* ---- Sidebar ---- */
.sidebar{width:220px;position:fixed;top:0;left:0;height:100vh;background:var(--forest);color:#fff;
  overflow-y:auto;display:flex;flex-direction:column;z-index:100;}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .badge-mint{display:inline-block;background:rgba(216,191,216,.2);color:var(--mint);
  border:1px solid rgba(216,191,216,.3);border-radius:99px;padding:3px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;}
.brand h1{font-size:16px;font-weight:800;margin:10px 0 3px;color:#fff;}
.brand .sub{font-size:10px;color:var(--mint);opacity:.8;letter-spacing:.5px;}
.nav{flex:1;padding:8px 0 90px;}
.nav-home{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:13px;color:rgba(255,255,255,.75);
  cursor:pointer;border-left:3px solid transparent;}
.nav-home:hover{background:rgba(216,191,216,.08);}
.nav-home.active{background:rgba(216,191,216,.15);border-left-color:var(--mint);color:#fff;}
.nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:rgba(216,191,216,.6);padding:14px 18px 5px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 26px;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.7);cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(216,191,216,.08);color:#fff;}
.nav-item.active{background:rgba(216,191,216,.15);border-left-color:var(--mint);color:#fff;}
.nav-item .idx{width:18px;height:18px;border-radius:99px;background:rgba(255,255,255,.1);font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.nav-item .done{margin-left:auto;color:var(--mint);font-weight:800;}
.progress-wrap{position:fixed;bottom:0;left:0;width:220px;background:var(--forest);padding:12px 18px 14px;
  border-top:1px solid rgba(255,255,255,.08);}
.progress-track{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--mint);width:0;transition:width .3s;}
.progress-label{font-size:11px;color:rgba(255,255,255,.7);margin-top:6px;}
/* ---- Main ---- */
.main-content{margin-left:220px;flex:1;min-height:100vh;width:calc(100% - 220px);}
.page{display:none;}
.page.active{display:block;animation:fadeIn .3s ease;}
/* ---- Overview ---- */
.hero{background:linear-gradient(135deg,var(--forest),var(--moss),var(--teal));color:#fff;padding:40px 48px;}
.hero h2{margin:0 0 8px;font-size:32px;font-weight:800;}
.hero p{margin:4px 0;opacity:.9;font-size:14px;}
.hero .stats{margin-top:14px;display:flex;gap:22px;flex-wrap:wrap;font-size:13px;}
.hero .stats b{font-size:20px;display:block;color:var(--mint);}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:32px 48px;}
.type-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);transition:all .2s;}
.type-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.type-card .th{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.type-card .tnum{background:var(--sage);color:var(--forest);border-radius:99px;width:26px;height:26px;font-size:12px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.type-card .tname{font-size:15px;font-weight:800;color:var(--forest);}
.pchip{display:flex;align-items:center;justify-content:space-between;background:var(--shell);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;margin-bottom:5px;cursor:pointer;color:var(--text-dark);}
.pchip:hover{border-color:var(--teal);}
.pchip.done{background:var(--green-light);}
.pchip .st{font-size:11px;color:var(--text-soft);}
.pchip.done .st{color:var(--green-success);font-weight:700;}
.type-card .tcount{font-size:11px;color:var(--text-soft);margin-top:8px;}
/* ---- Practice header ---- */
.p-header{background:linear-gradient(135deg,var(--forest),var(--moss),var(--teal));color:#fff;
  padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
.p-header .badge-mint{background:rgba(216,191,216,.2);color:var(--mint);border:1px solid rgba(216,191,216,.3);
  border-radius:99px;padding:3px 11px;font-size:10px;font-weight:800;letter-spacing:.4px;}
.p-header .ptitle{font-size:18px;font-weight:800;}
.p-header .spacer{flex:1;}
.timer-chip{background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:6px 16px;
  font-size:14px;font-weight:800;letter-spacing:1px;display:none;}
.timer-chip.show{display:inline-block;}
.timer-chip.warn{background:var(--amber);}
.score-chip{background:rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;font-weight:800;display:none;}
.score-chip.show{display:inline-block;}
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .15s;}
.btn-sm{padding:6px 14px;font-size:13px;}
.btn-primary{background:var(--forest);color:#fff;}
.btn-primary:hover{background:var(--moss);transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--forest);border:1.5px solid var(--border);}
.btn-finish{background:var(--mint);color:var(--forest);}
.btn-finish:disabled{opacity:.5;cursor:default;}
/* ---- Multi-bài practice ---- */
.phead-count{font-size:12px;font-weight:700;color:var(--mint);}
.bai-tabs{display:flex;gap:6px;padding:12px 24px;background:var(--sand);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:58px;z-index:19;}
.bai-tab{background:var(--white);border:1.5px solid var(--border);border-radius:99px;padding:7px 16px;
  font-size:13px;font-weight:800;color:var(--text-mid);cursor:pointer;font-family:inherit;transition:all .15s;}
.bai-tab:hover{border-color:var(--teal);}
.bai-tab.active{background:var(--forest);border-color:var(--forest);color:#fff;}
.bai-block{display:none;}
.bai-block.active{display:block;animation:fadeIn .25s;}
.bai-bar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--white);border-bottom:1px solid var(--border);}
.bai-bar .spacer{flex:1;}
.bai-title{font-size:14px;font-weight:800;color:var(--forest);}
.bai-bar .timer-chip{background:var(--sage);color:var(--forest);}
.bai-bar .timer-chip.warn{background:var(--amber);color:#fff;}
.bai-bar .score-chip.dark{background:var(--sage);color:var(--forest);}
.bai-block .workspace,.bai-block .start-gate{height:calc(100vh - 160px);}
/* ---- Notice / Start gate ---- */
.notice-bar{display:none;background:var(--amber-light);border-bottom:1px solid #FDE68A;padding:10px 24px;
  align-items:center;gap:12px;font-size:13px;color:var(--amber);}
.notice-bar.show{display:flex;}
.start-gate{display:flex;align-items:center;justify-content:center;height:calc(100vh - 58px);}
.start-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);padding:48px 56px;text-align:center;max-width:440px;}
.start-card .big{font-size:44px;}
.start-card h3{margin:10px 0 6px;font-size:22px;font-weight:800;color:var(--forest);}
.start-card p{margin:0 0 6px;font-size:14px;color:var(--text-soft);}
.start-card .meta{font-size:13px;color:var(--text-mid);font-weight:700;margin-bottom:18px;}
/* ---- Workspace 60/40 ---- */
.workspace{display:grid;grid-template-columns:60fr 40fr;height:calc(100vh - 58px);}
.workspace>*{overflow-y:auto;padding:24px;}
.col-work{border-right:1px solid var(--border);background:var(--sand);}
.col-assist{background:var(--shell);}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.col-head h3{margin:0;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mid);}
/* questions */
.q-group-instruction{background:var(--shell);border-left:4px solid var(--moss);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:12px 16px;font-size:13px;font-weight:600;color:var(--text-mid);margin:18px 0 12px;}
.options-box{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 16px;margin-bottom:12px;font-size:13.5px;line-height:1.9;}
.body-block{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);font-size:14px;line-height:2.1;}
.body-block table{border-collapse:collapse;width:100%;}
.body-block td,.body-block th{border:1px solid var(--border);padding:8px 12px;text-align:left;}
.blank-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  background:var(--forest);color:#fff;border-radius:99px;font-size:10px;font-weight:800;margin-right:4px;vertical-align:middle;}
.q-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--forest);color:#fff;
  border-radius:99px;font-size:13px;font-weight:800;flex:0 0 auto;}
.q-type-chip{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:var(--sage);color:var(--forest);
  border-radius:99px;padding:2px 9px;}
.q-prompt{font-size:14px;margin-bottom:10px;}
.q-dropdown{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--white);}
.q-dropdown:focus{border-color:var(--teal);outline:none;}
.q-dropdown.correct{border-color:var(--green-success);background:var(--green-light);}
.q-dropdown.incorrect{border-color:var(--red);background:var(--red-light);}
.blank-input{border:none;border-bottom:2px solid var(--border);background:transparent;font-size:14px;font-family:inherit;padding:6px 8px;width:100%;}
.blank-input:focus{border-bottom-color:var(--teal);outline:none;}
.blank-input.correct{border-bottom-color:var(--green-success);background:var(--green-light);}
.blank-input.incorrect{border-bottom-color:var(--red);background:var(--red-light);}
.blank-input.inline{width:150px;display:inline-block;text-align:center;}
.mcq-option{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;cursor:pointer;margin-bottom:8px;transition:all .15s;}
.mcq-option:hover{border-color:var(--teal);background:var(--sage);}
.mcq-option.selected{border-color:var(--blue);background:var(--blue-light);}
.mcq-option.correct{border-color:var(--green-success);background:var(--green-light);}
.mcq-option.incorrect{border-color:var(--red);background:var(--red-light);}
/* map labelling */
.map-wrap{position:relative;background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
.map-wrap img{display:block;width:100%;}
.map-zone{position:absolute;transform:translate(-50%,-50%);min-width:84px;padding:6px 10px;
  background:var(--white);border:2px dashed var(--teal);border-radius:var(--radius-sm);
  font-size:12px;font-weight:700;text-align:center;cursor:pointer;color:var(--text-soft);}
.map-zone.filled{border-style:solid;color:var(--forest);background:var(--sage);}
.map-zone.correct{border-color:var(--green-success);background:var(--green-light);color:var(--green-success);}
.map-zone.incorrect{border-color:var(--red);background:var(--red-light);color:var(--red);}
.label-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.label-chip{background:var(--white);border:1.5px solid var(--border);border-radius:99px;
  padding:6px 14px;font-size:13px;font-weight:700;cursor:grab;user-select:none;transition:all .15s;}
.label-chip:hover{border-color:var(--teal);background:var(--sage);}
.label-chip.selected{border-color:var(--blue);background:var(--blue-light);}
.label-chip.used{opacity:.35;pointer-events:none;}
/* learning assistant */
.tabbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{background:transparent;border:1.5px solid var(--border);border-radius:99px;
  padding:6px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-mid);cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--sage);border-color:var(--forest);color:var(--forest);}
.tab-pane{display:none;}
.tab-pane.active{display:block;animation:fadeIn .25s;}
.hint-note{font-size:12px;color:var(--text-soft);font-style:italic;margin-bottom:12px;line-height:1.5;}
.hint-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;font-size:13px;}
.hint-card .q-num{width:22px;height:22px;font-size:11px;}
.hint-listen{font-size:12px;font-weight:700;color:var(--text-mid);}
.hint-card ul{margin:4px 0 6px;padding-left:18px;font-size:13px;}
.hint-card li{margin-bottom:2px;}
.hint-chip{display:inline-block;background:var(--sage);color:var(--forest);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;margin-top:2px;}
.assist-list .a-item{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;margin-bottom:7px;font-size:13px;}
.vocab-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;margin-bottom:7px;font-size:13.5px;}
.vocab-card .ipa{color:var(--text-soft);font-size:12px;margin-left:6px;}
.vocab-card .vi{color:var(--text-mid);font-size:12.5px;margin-top:2px;}
/* review cards */
.review-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);font-size:13.5px;}
.review-card.ok{border-left:4px solid var(--green-success);}
.review-card.bad{border-left:4px solid var(--red);}
.rv-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.rv-verdict{font-size:13px;font-weight:800;}
.rv-verdict.ok{color:var(--green-success);}
.rv-verdict.bad{color:var(--red);}
.rv-verdict.retrying{color:var(--blue);}
.rv-row{display:flex;gap:8px;margin-bottom:4px;}
.rv-lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--text-soft);min-width:92px;padding-top:2px;}
.rv-your{color:var(--red);font-weight:700;}
.rv-your.neutral{color:var(--text-dark);}
.rv-correct{color:var(--green-success);font-weight:800;}
.rv-en{margin-top:8px;}
.rv-vi{margin-top:6px;color:var(--text-mid);font-size:13px;background:var(--shell);
  border-left:3px solid var(--sage);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:6px 10px;}
.rv-trap{margin-top:8px;background:var(--amber-light);color:var(--amber);border-radius:var(--radius-sm);
  padding:7px 10px;font-size:12.5px;font-weight:600;}
.rv-retry{margin-top:10px;}
.xp-quote{background:var(--shell);border-left:3px solid var(--moss);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:9px 12px;margin:8px 0 6px;font-style:italic;font-size:13px;}
/* transcript */
.transcript-sec{display:none;margin-top:28px;border-top:2px solid var(--border);padding-top:18px;}
.transcript-sec.revealed{display:block;animation:fadeIn .3s;}
.ts-turn{margin-bottom:14px;}
.ts-speaker{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--moss);}
.ts-en{font-size:14px;line-height:1.8;}
.ts-vi{display:none;font-size:13px;color:var(--text-mid);background:var(--white);border-left:3px solid var(--sage);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:6px 10px;margin-top:4px;line-height:1.7;}
.ts-vi.show{display:block;}
.ev{border-radius:3px;}
/* --- Evidence highlight: blinking pulse triggered by "Show in transcript" --- */
@keyframes evPulse{
  0%,100%{background:transparent;box-shadow:none;color:inherit;}
  50%{background:var(--flash);box-shadow:0 0 0 3px var(--flash);color:var(--forest);}
}
.ev.flash{animation:evPulse .8s ease-in-out 3;font-weight:700;}
/* word families / paraphrase bank / quiz / grammar */
.as-sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--forest);margin:16px 0 8px;}
.as-sec-title:first-child{margin-top:0;}
.wf-group{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.wf-head{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--moss);margin-bottom:6px;}
.wf-row{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:3px 0;border-bottom:1px dashed var(--border);}
.wf-row:last-child{border-bottom:none;}
.wf-row .pos{font-size:10px;font-weight:800;background:var(--sage);color:var(--forest);border-radius:99px;padding:1px 7px;flex:0 0 auto;}
.wf-row .wf-vi{color:var(--text-mid);font-size:12.5px;margin-left:auto;text-align:right;}
.pb-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-soft);padding:0 4px 4px;}
.pb-row{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:7px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;line-height:1.5;}
.pb-q{border-right:1px dashed var(--border);padding-right:8px;}
.pb-q b,.pb-t b{color:var(--teal);}
.pb-vi{grid-column:1/3;font-size:12px;color:var(--text-mid);border-top:1px dashed var(--border);padding-top:5px;}
.quiz-intro{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:26px 18px;text-align:center;}
.quiz-intro .big{font-size:34px;}
.quiz-intro b{display:block;font-size:17px;color:var(--forest);margin:6px 0 2px;}
.quiz-intro p{font-size:13px;color:var(--text-soft);margin:0 0 12px;}
.quiz-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.quiz-prog{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-soft);}
.quiz-time{font-size:13px;font-weight:800;color:var(--forest);}
.quiz-bar{height:5px;background:var(--shell);border-radius:99px;overflow:hidden;margin-bottom:12px;}
.quiz-bar-fill{height:100%;background:var(--teal);transition:width 1s linear;}
.quiz-bar-fill.low{background:var(--amber);}
.quiz-q{font-size:14px;font-weight:600;margin-bottom:10px;}
.quiz-opt{font-size:13.5px;padding:9px 12px;}
.gr-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:13.5px;}
.gr-name{font-size:13px;font-weight:800;color:var(--forest);margin-bottom:4px;}
.gr-en{margin-top:6px;font-size:13px;}
/* placeholder */
.placeholder-card{background:var(--white);border:2px dashed var(--border);border-radius:var(--radius);padding:48px;text-align:center;color:var(--text-soft);margin:40px auto;max-width:520px;}
.placeholder-card .big{font-size:40px;}
.placeholder-card b{color:var(--forest);display:block;margin:10px 0 6px;font-size:16px;}
/* reset fab */
.reset-fab{position:fixed;bottom:24px;right:24px;background:var(--red);color:#fff;border-radius:99px;padding:12px 20px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);z-index:200;border:none;cursor:pointer;display:none;}
.reset-fab.show{display:block;}
/* assistant drawer (responsive) */
.assist-toggle{display:none;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:1280px){
  .workspace{grid-template-columns:1fr;}
  .col-assist{position:fixed;top:0;right:0;width:340px;height:100vh;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s;z-index:150;}
  .col-assist.open{transform:translateX(0);}
  .assist-toggle{display:block;position:fixed;right:0;bottom:80px;background:var(--forest);color:#fff;border:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;z-index:151;}
}
@media (max-width:1024px){
  .workspace{height:auto;}
  .workspace>*{overflow:visible;}
  .col-work{border-right:none;}
  .start-gate{height:auto;padding:60px 20px;}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  /* no blinking, but the evidence must still be findable: steady highlight */
  .ev.flash{animation:none;background:var(--flash);box-shadow:0 0 0 3px var(--flash);color:var(--forest);}}
</style>

/* ==========================================================================
   GLOBAL TYPOGRAPHY — single source of truth for fonts across all lessons
   English → Merriweather · Vietnamese → Big Shoulders (refined diacritics)
   The @font-face blocks are NOT here: they are generated (base64) by
   assets/embed_fonts.py, or loaded from Google Fonts in cdn mode.
   ========================================================================== */

:root{
  /* --- Font tokens: use these, never hard-code a family name --- */
  --font-en: 'Merriweather', 'BigShoulders', Georgia, 'Times New Roman', serif;
  --font-vi: 'BigShoulders', 'Merriweather', 'Arial Narrow', Georgia, serif;

  /* Merriweather has no Vietnamese glyphs in the embedded subset, so
     BigShoulders sits second in --font-en: a stray Vietnamese character
     inside English text still renders, instead of dropping to a system font. */

  /* --- Vietnamese optical compensation ---
     Big Shoulders x-height 0.600em vs Merriweather 0.553em → VI text looks
     ~8% LARGER at the same font-size (the opposite problem from a small-x-height
     face). Corrected with size-adjust inside @font-face, so nothing else in a
     lesson needs to change. */
  --vi-size-adjust: 92%;

  /* --- Reading rhythm --- */
  --lh-tight: 1.35;    /* headings, buttons, chips */
  --lh-body: 1.7;      /* prose, explanations */
  --lh-loose: 2.0;     /* note/table bodies with inline inputs */
  --ls-caps: .5px;     /* letter-spacing for uppercase labels */
}

/* ==========================================================================
   1. DEFAULT — everything is English unless marked Vietnamese
   ========================================================================== */
html, body{
  font-family: var(--font-en);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Every UI surface inherits explicitly: headings, body, buttons, labels,
   questions, answers, tables, explanations. Listed so no component is missed
   when a lesson introduces a new class. */
h1, h2, h3, h4, h5, h6,
p, li, td, th, blockquote, figcaption, label, legend, summary,
button, input, select, textarea, option{
  font-family: inherit;
}
button, input, select, textarea{ font-size: inherit; }

h1, h2, h3, h4, h5, h6{ line-height: var(--lh-tight); }
th{ font-weight: 700; }

/* ==========================================================================
   2. VIETNAMESE — anything marked as Vietnamese switches family
   Two ways to mark it, both supported:
     a) lang attribute  → <div lang="vi">…</div>      (preferred, semantic)
     b) a .vi-ish class → the project's existing Vietnamese class names
   ========================================================================== */
:lang(vi),
[lang="vi"],
.vi,
.vn,
.vietnamese,
.ts-vi,          /* bilingual transcript — Vietnamese line       */
.rv-vi,          /* review card — Vietnamese explanation         */
.wf-vi,          /* word families — Vietnamese gloss             */
.pb-vi,          /* paraphrase bank — Vietnamese caption         */
.vocab-card .vi, /* vocabulary card — Vietnamese meaning         */
.gr-card .rv-vi{ /* grammar card — Vietnamese note               */
  font-family: var(--font-vi);
}

/* Big Shoulders is condensed and heavy: Vietnamese needs air between letters and
   lines, or the stacked tone marks (ế, ữ, ợ) start colliding with the line above. */
:lang(vi), [lang="vi"], .vi, .ts-vi, .rv-vi, .wf-vi, .pb-vi{
  line-height: var(--lh-body);
  letter-spacing: .01em;
  word-spacing: .04em;
}

/* An English fragment inside a Vietnamese block goes back to Merriweather —
   e.g. a quoted keyword, a paraphrase pair, an IPA transcription. */
:lang(vi) :lang(en), [lang="vi"] [lang="en"],
:lang(vi) .en, [lang="vi"] .en,
:lang(vi) code, :lang(vi) .ipa,
.ts-vi .en, .rv-vi .en{
  font-family: var(--font-en);
}

/* ==========================================================================
   3. DISPLAY-ONLY MODE (opt-in)
   Big Shoulders is a condensed display face. It is striking for headings and
   short lines; six paragraphs of it at 13px is heavier going than a text face.
   Add class "vi-display-only" on the body element to keep Big Shoulders for
   Vietnamese headings/short labels while long Vietnamese prose uses Merriweather.
   Off by default — the project rule is Vietnamese → Big Shoulders everywhere.
   ========================================================================== */
body.vi-display-only .ts-vi,
body.vi-display-only .rv-vi,
body.vi-display-only .pb-vi,
body.vi-display-only p:lang(vi),
body.vi-display-only li:lang(vi){
  font-family: var(--font-en);
}
body.vi-display-only h1:lang(vi),
body.vi-display-only h2:lang(vi),
body.vi-display-only h3:lang(vi),
body.vi-display-only .vi-title{
  font-family: var(--font-vi);
}

/* ==========================================================================
   4. SMALL-SIZE GUARD
   Big Shoulders is narrow: at small sizes the counters (the holes in a, e, o)
   close up and the two-mark diacritics merge. The floor is raised to 13px
   because size-adjust:92% already shrinks it below the nominal font-size.
   ========================================================================== */
.ts-vi, .rv-vi, .wf-vi, .pb-vi, .vocab-card .vi{
  font-size: max(13px, 1em);
}

/* ==========================================================================
   5. PRINT
   Big Shoulders is bold enough to survive a photocopier, so Vietnamese keeps
   its face in print. Only the letter-spacing is relaxed — condensed type sets
   tighter on paper than on screen.
   ========================================================================== */
@media print{
  :lang(vi), [lang="vi"], .vi, .ts-vi, .rv-vi, .wf-vi, .pb-vi{
    letter-spacing: .02em;
  }
}

  transcript: [
    { en: "Labyrinths have existed for well over 4,000 years. Labyrinths and labyrinthine symbols have been found in regions as diverse as modern-day Turkey, Ireland, Greece, and India. There are various designs of labyrinth but what they all have in common is a winding spiral path which leads to a central area. There is one starting point at the entrance and the goal is to reach the central area. Finding your way through a labyrinth involves many twists and turns, but it's not possible to get lost as there is only one single path.",
      vi: "Mê lộ (đường một lối) đã tồn tại từ hơn 4.000 năm trước. Mê lộ và các biểu tượng hình mê lộ đã được tìm thấy ở nhiều khu vực đa dạng như Thổ Nhĩ Kỳ, Ireland, Hy Lạp và Ấn Độ ngày nay. Có nhiều thiết kế mê lộ khác nhau, nhưng điểm chung của chúng là đều có một con đường xoắn ốc uốn lượn dẫn đến khu vực trung tâm. Chỉ có một điểm bắt đầu duy nhất ở lối vào và mục tiêu là đi đến được khu vực trung tâm. Việc tìm đường đi qua một mê lộ đòi hỏi nhiều khúc cua và ngã rẽ, nhưng bạn không thể bị lạc vì chỉ có một con đường duy nhất." },
    { en: "In modern times, the word labyrinth has taken on a different meaning and is often used as a synonym for a maze. <span class='ev' id='d1p1b2-ev-q31'>A maze is quite different as it is a kind of puzzle</span> with an intricate network of paths. Mazes became fashionable in the 15th and 16th centuries in Europe, and can still be found in the gardens of great houses and palaces. The paths are usually surrounded by thick, high hedges so that it's not possible to see over them. Entering a maze usually involves getting lost a few times <span class='ev' id='d1p1b2-ev-q32'>before using logic to work out the pattern</span> and find your way to the centre and then out again. There are lots of dead ends and paths which lead you back to where you started. The word 'maze' is believed to <span class='ev' id='d1p1b2-ev-q33'>come from a Scandinavian word for a state of confusion</span>. This is where the word 'amazing' comes from.",
      vi: "Trong thời kỳ hiện đại, từ 'labyrinth' đã mang một ý nghĩa khác và thường được dùng như một từ đồng nghĩa với từ 'maze' (mê cung). Một mê cung thì khá khác biệt vì nó là một dạng trò chơi câu đố (Q31) với một mạng lưới đường đi phức tạp. Mê cung trở nên thịnh hành vào thế kỷ 15 và 16 ở Châu Âu, và ngày nay vẫn có thể được tìm thấy trong vườn của các dinh thự và cung điện lớn. Các lối đi thường được bao quanh bởi những hàng rào cây cao và dày đến mức không thể nhìn qua được. Việc đi vào một mê cung thường khiến bạn bị lạc vài lần trước khi phải dùng tư duy logic để tìm ra quy luật (Q32), từ đó tìm đường đến trung tâm rồi lại đi ra ngoài. Có rất nhiều ngõ cụt và những con đường dẫn bạn quay trở lại điểm xuất phát. Từ 'maze' được cho là bắt nguồn từ một từ vùng Scandinavia có nghĩa là trạng thái bối rối/nhầm lẫn (Q33). Đây cũng là nguồn gốc của từ 'amazing'." },
    { en: "Labyrinths, on the other hand, have a very different function. Although people now often refer to things they find complicated as labyrinths, this is not how they were seen in the past. The winding spiral of the labyrinth has been used for centuries as a metaphor for life's journey. It served as a spiritual reminder that there is purpose and meaning to our lives and helped to give people a sense of direction. Labyrinths are thought to encourage a feeling of calm and have been <span class='ev' id='d1p1b2-ev-q34'>used as a meditation and prayer tool in many cultures</span> over many centuries.",
      vi: "Mặt khác, mê lộ lại có một chức năng rất khác biệt. Mặc dù ngày nay mọi người thường gọi những thứ phức tạp là 'labyrinths', nhưng đây không phải là cách chúng được nhìn nhận trong quá khứ. Đường xoắn ốc uốn lượn của mê lộ đã được sử dụng trong nhiều thế kỷ như một phép ẩn dụ cho hành trình cuộc đời. Nó đóng vai trò như một lời nhắc nhở tâm linh rằng cuộc sống của chúng ta có mục đích, ý nghĩa và giúp con người có được cảm giác về định hướng. Mê lộ được cho là giúp thúc đẩy cảm giác bình yên và đã được sử dụng như một công cụ thiền định và cầu nguyện (Q34) trong nhiều nền văn hóa qua nhiều thế kỷ." },
    { en: "The earliest examples of the labyrinth spiral pattern have been <span class='ev' id='d1p1b2-ev-q35'>found carved into stone</span>, from Sardinia to Scandinavia, from Arizona to India to Africa. In Europe, these spiral carvings date from the late Bronze Age. The Native American Pima tribe wove baskets with a circular labyrinth design that depicted their own cosmology. In Ancient Greece, <span class='ev' id='d1p1b2-ev-q36'>the labyrinth spiral was used on coins around four thousand years ago</span>. Labyrinths made of mosaics were commonly found in bathhouses, villas and tombs throughout the Roman Empire.",
      vi: "Những ví dụ sớm nhất về họa tiết xoắn ốc của mê lộ đã được tìm thấy dưới dạng khắc vào đá (Q35), từ Sardinia đến Scandinavia, từ Arizona đến Ấn Độ và cả Châu Phi. Ở Châu Âu, những hình khắc xoắn ốc này có niên đại từ cuối thời kỳ Đồ đồng. Bộ tộc Pima da đỏ bản địa Mỹ đã dệt những chiếc giỏ có thiết kế mê lộ tròn để mô tả vũ trụ quan của riêng họ. Ở Hy Lạp cổ đại, hình xoắn ốc mê lộ đã được sử dụng trên các đồng tiền xu (Q36) từ khoảng bốn nghìn năm trước. Các mê lộ làm bằng tranh khảm thường được tìm thấy trong các nhà tắm công cộng, biệt thự và lăng mộ khắp Đế chế La Mã." },
    { en: "In Northern Europe, there were actual physical labyrinths designed for walking on. These were cut into the turf or grass, usually in a circular pattern. The origin of these walking labyrinths remains unclear, but they were probably used for fertility rites which may date back thousands of years. Eleven examples of turf labyrinths survive today, including the largest one at Saffron Walden, England, <span class='ev' id='d1p1b2-ev-q37'>which used to have a large tree in the middle of it</span>.",
      vi: "Ở Bắc Âu, từng có những mê lộ vật lý thực sự được thiết kế để mọi người đi bộ lên đó. Chúng được cắt sâu vào lớp đất cỏ hoặc thảm cỏ, thường theo hình tròn. Nguồn gốc của những mê lộ đi bộ này vẫn chưa rõ ràng, nhưng chúng có lẽ đã được sử dụng cho các nghi lễ phồn thực có niên đại từ hàng ngàn năm trước. Mười một nguyên mẫu mê lộ trên thảm cỏ vẫn còn tồn tại đến ngày nay, bao gồm cả cái lớn nhất tại Saffron Walden, Anh, nơi từng có một cây cổ thụ lớn ở chính giữa (Q37)." },
    { en: "More recently labyrinths have experienced something of a revival. Some believe that walking a labyrinth promotes healing and mindfulness, and there are those who believe in its emotional and physical benefits, <span class='ev' id='d1p1b2-ev-q38'>which include slower breathing</span> and a restored sense of balance and perspective. This idea has become so popular that labyrinths have been laid into the floors of spas, wellness centres and even prisons in recent years.",
      vi: "Gần đây, mê lộ đang trải qua một sự hồi sinh mạnh mẽ. Một số người tin rằng đi bộ trong mê lộ giúp thúc đẩy sự chữa lành và chánh niệm, và cũng có những người tin vào các lợi ích về mặt thể chất lẫn cảm xúc của nó, bao gồm nhịp thở chậm hơn (Q38) cùng cảm giác cân bằng và góc nhìn cuộc sống được khôi phục. Ý tưởng này đã trở nên phổ biến đến mức trong những năm gần đây, các mê lộ đã được lát ngay trên sàn của các spa, trung tâm chăm sóc sức khỏe và thậm chí cả trong các nhà tù." },
    { en: "A pamphlet at Colorado Children's Hospital informs patients that 'walking a labyrinth can often calm people in the midst of a crisis'. And apparently, it's not only patients who benefit. Many visitors find walking a labyrinth less stressful than sitting in a corridor or waiting room. Some doctors even walk the labyrinth during their breaks. In some hospitals, patients who can't walk <span class='ev' id='d1p1b2-ev-q39'>can have a paper 'finger labyrinth' brought to their bed</span>. The science behind the theory is a little sketchy, but there are dozens of small-scale studies which support claims about the benefits of labyrinths. For example, one study found that walking a labyrinth <span class='ev' id='d1p1b2-ev-q40'>provided 'short-term calming, relaxation, and relief from anxiety' for Alzheimer's patients</span>.",
      vi: "Một cuốn tờ rơi tại Bệnh viện Nhi đồng Colorado thông tin đến bệnh nhân rằng 'việc đi bộ trong mê lộ thường có thể giúp xoa dịu con người ngay giữa cơn khủng hoảng'. Và rõ ràng, không chỉ các bệnh nhân mới được hưởng lợi. Nhiều khách đến thăm nhận thấy việc đi bộ trong mê lộ ít căng thẳng hơn nhiều so với việc ngồi ở hành lang hoặc phòng chờ. Một số bác sĩ thậm chí còn đi bộ trong mê lộ trong giờ nghỉ của họ. Ở một số bệnh viện, những bệnh nhân không thể đi lại có thể được mang đến tận giường một chiếc 'mê lộ ngón tay' bằng giấy (Q39). Cơ sở khoa học đằng sau lý thuyết này còn hơi sơ sài, nhưng có hàng tá nghiên cứu quy mô nhỏ ủng hộ những tuyên bố về lợi ích của mê lộ. Ví dụ, một nghiên cứu cho thấy việc đi bộ trong mê lộ mang lại 'sự bình tĩnh ngắn hạn, thư giãn và giảm bớt lo âu' cho các bệnh nhân Alzheimer (Q40)." },
    { en: "So, what is it about labyrinths that makes their appeal so universal? Well…",

  transcript: [
    { en: "For my presentation today I want to tell you about how groups of elephants have been moved and settled in new reserves. This is known as translocation and has been carried out in Malawi in Africa in recent years. The reason this is being done is because of overpopulation of elephants in some areas.",
      vi: "Trong bài thuyết trình hôm nay, tôi muốn nói về cách các đàn voi được di dời và định cư tại các khu bảo tồn mới. Quá trình này gọi là translocation và đã được thực hiện ở Malawi, Châu Phi trong những năm gần đây. Lý do là vì tình trạng voi quá đông ở một số khu vực." },
    { en: "Overpopulation is a good problem to have and not one we tend to hear about very often. In Malawi's Majete National Park the elephant population had been wiped out by poachers, who killed the elephants for their ivory. But in 2003, the park was restocked and effective law enforcement was introduced. Since then, not a single elephant has been poached. In this safe environment, the elephant population boomed. Breeding went so well that there were more elephants than the park could support.",
      vi: "Quá đông là một 'vấn đề tích cực' và không phải điều ta thường nghe. Tại Vườn quốc gia Majete của Malawi, quần thể voi từng bị xóa sổ bởi những kẻ săn trộm giết voi lấy ngà. Nhưng năm 2003, vườn được bổ sung voi và áp dụng thực thi pháp luật hiệu quả. Kể từ đó, không con voi nào bị săn trộm. Trong môi trường an toàn này, số lượng voi tăng bùng nổ. Việc sinh sản tốt đến mức số voi vượt quá khả năng nuôi dưỡng của vườn." },
    { en: "This led to a number of problems. Firstly, there was more competition for food, which meant that some elephants were suffering from hunger. As there was a limit to the amount of food in the national park, some elephants began looking further afield. <span class='ev' id='d1p2b5-ev-q31'>Elephants were routinely knocking down fences around the park</span>, which then had to be repaired at a significant cost.",
      vi: "Điều này dẫn đến nhiều vấn đề. Thứ nhất, cạnh tranh thức ăn tăng, khiến một số con voi bị đói. Vì nguồn thức ăn trong vườn có hạn, một số con bắt đầu tìm kiếm ở vùng xa hơn. Voi thường xuyên húc đổ hàng rào quanh vườn, sau đó phải sửa chữa với chi phí đáng kể." },
    { en: "To solve this problem, the decision was made to move dozens of elephants from Majete National Park to Nkhotakota Wildlife Park, where there were no elephants. But, obviously, attempting to move significant numbers of elephants to a new home 300 kilometres away is quite a challenge. So how did this translocation process work in practice?",
      vi: "Để giải quyết, họ quyết định di dời hàng chục con voi từ Majete đến Khu bảo tồn Nkhotakota – nơi chưa có voi nào. Nhưng rõ ràng, việc di dời số lượng lớn voi đến ngôi nhà mới cách 300 km là một thử thách lớn. Vậy quy trình này diễn ra thực tế thế nào?" },
    { en: "Elephants were moved in groups of between eight and twenty, <span class='ev' id='d1p2b5-ev-q32'>all belonging to one family. Because relationships are very important to elephants</span>, they all had to be moved at the same time. <span class='ev' id='d1p2b5-ev-q33'>A team of vets and park rangers flew over the park in helicopters</span> and targeted a group, which were rounded up and directed to a designated open plain.",
      vi: "Voi được di dời theo nhóm từ 8 đến 20 con, tất cả thuộc cùng một gia đình. Vì quan hệ gia đình rất quan trọng với voi, chúng phải được di chuyển cùng lúc. Một đội bác sĩ thú y và kiểm lâm bay trên vườn bằng trực thăng, nhắm vào một nhóm, dồn và hướng chúng đến một đồng bằng mở đã chỉ định." },
    { en: "The vets then used darts to immobilise the elephants – this was a tricky manoeuvre, as they not only had to select the right dose of tranquiliser for different-sized elephants but they had to dart the elephants as they were running around. <span class='ev' id='d1p2b5-ev-q34'>This also had to be done as quickly as possible so as to minimise the stress caused.</span> As soon as the elephants began to flop onto the ground, the team moved in to take care of them.",
      vi: "Sau đó các bác sĩ thú y dùng phi tiêu làm bất động voi – đây là thao tác phức tạp, vì họ vừa phải chọn đúng liều thuốc an thần cho từng kích cỡ voi vừa phải bắn khi chúng đang chạy. Việc này cũng phải làm càng nhanh càng tốt để giảm thiểu căng thẳng gây ra. Ngay khi voi bắt đầu ngã xuống, cả đội tiếp cận chăm sóc chúng." },
    { en: "To avoid the risk of suffocation, the team had to make sure none of the elephants were lying on their chests because their lungs could be crushed in this position. <span class='ev' id='d1p2b5-ev-q35'>So all the elephants had to be placed on their sides.</span> One person stayed with each elephant while they waited for the vets to do checks. <span class='ev' id='d1p2b5-ev-q36'>It was very important to keep an eye on their breathing</span> – if there were fewer than six breaths per minute, the elephant would need urgent medical attention. Collars were fitted to the matriarch in each group so their movements could be tracked in their new home. <span class='ev' id='d1p2b5-ev-q37'>Measurements were taken of each elephant's tusks – elephants with large tusks would be at greater risk from poachers – and also of their feet.</span> The elephants were then taken to a recovery area before being loaded onto trucks and transported to their new home.",
      vi: "Để tránh nguy cơ nghẹt thở, cả đội phải đảm bảo không con voi nào nằm sấp ngực vì phổi có thể bị đè ở tư thế đó. Vì vậy tất cả voi đều phải được đặt nằm nghiêng. Một người túc trực bên mỗi con voi trong lúc chờ bác sĩ kiểm tra. Việc theo dõi hơi thở là cực kỳ quan trọng – nếu thở dưới 6 nhịp mỗi phút, con voi cần chăm sóc y tế khẩn cấp. Vòng cổ được đeo cho con đầu đàn mỗi nhóm để theo dõi di chuyển tại nơi ở mới. Số đo ngà của từng con được ghi lại – voi ngà lớn có rủi ro cao hơn từ kẻ săn trộm – và cả bàn chân của chúng. Sau đó voi được đưa đến khu phục hồi trước khi chất lên xe tải và chuyển đến nhà mới." },
    { en: "The elephants translocated to Nkhotakota settled in very well and the project has generally been accepted to have been a huge success – and not just for the elephants. <span class='ev' id='d1p2b5-ev-q38'>Employment prospects have improved enormously</span>, contributing to rising living standards for the whole community. Poaching is no longer an issue, as former poachers are able to find more reliable sources of income. In fact, <span class='ev' id='d1p2b5-ev-q39'>many of them volunteered to give up their weapons</span>, as they were no longer of any use to them.",
      vi: "Những con voi được di dời đến Nkhotakota đã định cư rất tốt và dự án nhìn chung được công nhận là thành công lớn – không chỉ với loài voi. Triển vọng việc làm cải thiện đáng kể, góp phần nâng cao mức sống cho cả cộng đồng. Nạn săn trộm không còn là vấn đề, vì những kẻ săn trộm cũ tìm được nguồn thu nhập đáng tin cậy hơn. Thực tế, nhiều người tự nguyện giao nộp vũ khí vì chúng không còn tác dụng gì." },
    { en: "More than two dozen elephants have been born at Nkhotakota since relocation. With an area of more than 1,800 square kilometres, there's plenty of space for the elephant population to continue to grow. Their presence is also helping to rebalance Nkhotakota's damaged ecosystem and providing a sustainable conservation model, which could be replicated in other parks. <span class='ev' id='d1p2b5-ev-q40'>All this has been a big draw for tourism, which contributes five times more than the illegal wildlife trade to GDP</span>, and this is mainly because of the elephants. There's also been a dramatic rise in interest…",
      vi: "Hơn hai chục con voi đã được sinh ra tại Nkhotakota kể từ khi di dời. Với diện tích hơn 1.800 km vuông, còn nhiều không gian để quần thể voi tiếp tục phát triển. Sự hiện diện của chúng cũng giúp tái cân bằng hệ sinh thái bị tổn hại và cung cấp mô hình bảo tồn bền vững có thể nhân rộng sang các vườn khác. Tất cả điều này là điểm thu hút lớn cho du lịch – ngành đóng góp vào GDP gấp 5 lần buôn bán động vật hoang dã trái phép, chủ yếu nhờ loài voi. Cũng có sự gia tăng mạnh về mức độ quan tâm…" }
  ]

    { en: "Right, everyone, let's make a start. Over the past few sessions, we've been considering the reasons why some world languages are in decline, and today I'm going to introduce another factor that affects languages, and the speakers of those languages, and that's technology and, in particular, digital technology. In order to illustrate its effect, I'm going to focus on the Icelandic language, which <span class='ev' id='d1p3b1-ev-q31'>is spoken by around 321,000 people</span>, most of whom live in Iceland – an island in the North Atlantic Ocean.",

    { en: "The problem for this language is not the number of speakers – even though this number is small. Nor is it about losing words to other languages, such as English. In fact, <span class='ev' id='d1p3b1-ev-q32'>the vocabulary of Icelandic is continually increasing</span> because when speakers need a new word for something, they tend to create one, rather than borrowing from another language. All this makes Icelandic quite a special language – it's changed very little in the past millennium, yet it can handle twenty-first-century concepts related to the use of computers and digital technology. Take, for example, the word for web browser … this is vafri in Icelandic, which comes from the verb 'to wander'. I can't think of a more appropriate term because that's exactly what you do mentally when you browse the internet. Then <span class='ev' id='d1p3b1-ev-q33'>there's an Icelandic word for podcast – which is too hard to pronounce!</span> And so on.",

  transcript: [
    { en: "Scientists believe that a majority of the earth's bird population migrate in some fashion or other. Some travel seasonally for relatively short distances, such as birds that move from their winter habitats in lowlands to mountain tops for the summers. Others, like the Arctic Tern, travel more than 25,000 miles seasonally between the northern and southern poles. Bird migration has been studied over many centuries through a variety of observations.",
      vi: "Các nhà khoa học tin rằng phần lớn quần thể chim trên Trái Đất di cư theo một hình thức nào đó. Một số di chuyển theo mùa trên khoảng cách tương đối ngắn, như những loài chim từ môi trường sống mùa đông ở vùng đồng bằng lên đỉnh núi vào mùa hè. Loài khác như nhạn biển Bắc Cực di chuyển hơn 25.000 dặm theo mùa giữa hai cực. Việc di cư của chim đã được nghiên cứu qua nhiều thế kỷ." },
    { en: "But until relatively recently, where birds went to in the winter was considered something of a mystery. The lack of modern science and technology led to many theories that we now recognize as error-filled and even somewhat amusing. Take hibernation theory for example – two thousand years ago, it was commonly believed that when birds left an area, they went underwater to hibernate in the seas and oceans. Another theory for the regular appearance and disappearance of birds was that <span class='ev' id='d1p3b2-ev-q31'>they spend winter hidden in mud till the weather changed</span> and food became abundant again. The theory that some birds hibernate persisted until experiments were done on caged birds in the 1940s which demonstrated that birds have no hibernation instinct.",
      vi: "Nhưng cho đến gần đây, nơi chim đến vào mùa đông vẫn được coi là điều bí ẩn. Sự thiếu khoa học công nghệ hiện đại dẫn đến nhiều thuyết mà ngày nay ta thấy đầy lỗi và thậm chí buồn cười. Ví dụ thuyết ngủ đông – hai nghìn năm trước, người ta thường tin rằng khi chim rời một khu vực, chúng lặn xuống nước ngủ đông dưới biển và đại dương. Một thuyết khác cho rằng chúng trải qua mùa đông ẩn trong bùn cho đến khi thời tiết thay đổi và thức ăn dồi dào trở lại. Thuyết chim ngủ đông tồn tại đến khi các thí nghiệm trên chim nhốt lồng vào những năm 1940 chứng minh chim không có bản năng ngủ đông." },
    { en: "One of the earliest naturalists and philosophers from ancient Greece was Aristotle who was the first writer to discuss the disappearance and reappearance of some bird species at certain times of year. He developed the theory of transmutation, the seasonal change of one species into another, by observing redstarts and robins. He observed that in the autumn, <span class='ev' id='d1p3b2-ev-q32'>small birds called 'redstarts' began to lose their feathers</span>, which convinced Aristotle that they changed into robins for the winter, and back into redstarts in the summer. These assumptions are understandable given that <span class='ev' id='d1p3b2-ev-q33'>this pair of species are similar in shape</span>, but are a classic example of an incorrect interpretation based on correct observations.",
      vi: "Một trong những nhà tự nhiên học và triết gia sớm nhất Hy Lạp cổ đại là Aristotle, người đầu tiên bàn về sự biến mất và xuất hiện trở lại của một số loài chim. Ông phát triển thuyết biến chủng – sự biến đổi theo mùa từ loài này sang loài khác – bằng cách quan sát chim đuôi đỏ và chim oanh. Ông thấy vào mùa thu, những con chim nhỏ gọi là 'redstarts' bắt đầu rụng lông, khiến ông tin rằng chúng biến thành chim oanh vào mùa đông và trở lại vào mùa hè. Những giả định này có thể hiểu được vì hai loài có hình dáng tương tự, nhưng là ví dụ điển hình về diễn giải sai dựa trên quan sát đúng." },
    { en: "The most bizarre theory was put forward by an English amateur scientist, Charles Morton, in the seventeenth century. He wrote a surprisingly well-regarded paper <span class='ev' id='d1p3b2-ev-q34'>claiming that birds migrate to the moon and back every year</span>. He came to this conclusion as the only logical explanation for the total disappearance of some species.",
      vi: "Thuyết kỳ lạ nhất do một nhà khoa học nghiệp dư người Anh, Charles Morton, đưa ra vào thế kỷ 17. Ông viết một bài báo được đánh giá cao một cách đáng ngạc nhiên, tuyên bố rằng chim di cư lên Mặt Trăng rồi quay lại mỗi năm. Ông kết luận vậy vì cho đó là lời giải thích hợp lý duy nhất cho sự biến mất hoàn toàn của một số loài." },
    { en: "One of the key moments in the development of migration theory came in 1822 when a white stork was shot in Germany. This particular stork made history <span class='ev' id='d1p3b2-ev-q35'>because of the long spear in its neck</span> which incredibly had not killed it – everyone immediately realised this spear was definitely not European. It turned out to be a spear from a tribe in Central Africa. This was a truly defining moment in the history of ornithology because <span class='ev' id='d1p3b2-ev-q36'>it was the first evidence that storks spend their winters in sub-Saharan Africa</span>. You can still see the 'arrow stork' in the Zoological Collection of the University of Rostock in Germany.",
      vi: "Một thời điểm then chốt trong sự phát triển thuyết di cư đến vào năm 1822 khi một con cò trắng bị bắn ở Đức. Con cò này đi vào lịch sử vì ngọn giáo dài đâm qua cổ mà kỳ lạ là không giết chết nó – mọi người lập tức nhận ra ngọn giáo chắc chắn không phải của châu Âu. Hóa ra đó là giáo của một bộ tộc ở Trung Phi. Đây là thời khắc quyết định trong lịch sử điểu học vì đó là bằng chứng đầu tiên cho thấy cò trải qua mùa đông ở vùng cận Sahara châu Phi. Bạn vẫn có thể thấy 'con cò mũi tên' tại Bộ sưu tập Động vật học Đại học Rostock, Đức." },
    { en: "People gradually became aware that European birds moved south in autumn and north in summer but didn't know much about it until the practice of catching birds and putting rings on their legs became established. Before this, <span class='ev' id='d1p3b2-ev-q37'>very little information was available about the actual destinations of particular species</span> and how they travelled there. People speculated that larger birds provided a kind of taxi service for smaller birds by carrying them on their backs. This idea came about because <span class='ev' id='d1p3b2-ev-q38'>it seemed impossible that small birds weighing only a few grams could fly over vast oceans</span>. This idea was supported by observations of bird behaviour such as the harassment of larger birds by smaller birds.",
      vi: "Mọi người dần nhận ra chim châu Âu di chuyển về nam vào mùa thu và về bắc vào mùa hè nhưng không biết nhiều cho đến khi việc bắt chim và đeo vòng vào chân trở nên phổ biến. Trước đó, có rất ít thông tin về điểm đến thực sự của từng loài và cách chúng đi đến đó. Người ta suy đoán chim lớn cung cấp dịch vụ 'taxi' cho chim nhỏ bằng cách chở trên lưng. Ý tưởng này nảy sinh vì dường như bất khả thi khi chim nhỏ chỉ nặng vài gram có thể bay qua đại dương bao la. Ý tưởng được củng cố bởi quan sát hành vi chim, như việc chim nhỏ quấy rầy chim lớn." },
    { en: "The development of bird ringing, by a Danish schoolteacher, Hans Christian Cornelius Mortensen, made many discoveries possible. This is still common practice today and <span class='ev' id='d1p3b2-ev-q39'>relies upon what is known as 'recovery'</span> – this is when ringed birds are found dead in the place they have migrated to, and identified. Huge amounts of data were gathered in the early part of the twentieth century and for the first time in history people understood where birds actually went to in winter. <span class='ev' id='d1p3b2-ev-q40'>In 1931, an atlas was published showing where the most common species of European birds migrated to</span>. More recent theories about bird migration…",
      vi: "Việc đeo vòng cho chim, do giáo viên Đan Mạch Hans Christian Cornelius Mortensen khởi xướng, đã giúp tạo nhiều phát hiện. Đây vẫn là thực hành phổ biến ngày nay và dựa vào cái gọi là 'recovery' – khi chim đeo vòng được tìm thấy đã chết ở nơi chúng di cư đến và được xác định danh tính. Khối lượng dữ liệu khổng lồ được thu thập đầu thế kỷ 20 và lần đầu tiên con người hiểu chim thực sự đi đâu vào mùa đông. Năm 1931, một cuốn atlas được xuất bản cho thấy nơi di cư của các loài chim châu Âu phổ biến nhất. Các thuyết gần đây hơn về di cư…" }
  ]

  transcript: [
    { en: "Hello everyone. Today we're going to look at another natural food product and that's maple syrup. What is this exactly? Well, maple syrup looks rather like clear honey, but it's not made by bees; it's produced from the plant fluid – or sap – inside the maple tree and that makes maple syrup a very natural product. Maple syrup is <span class='ev' id='d1p3b3-ev-q31'>a thick, golden, sweet-tasting liquid</span> that can be bought in bottles or jars and poured onto food such as waffles and ice cream or used in the baking of cakes and pastries. It contains no preservatives or added ingredients, and <span class='ev' id='d1p3b3-ev-q32'>it provides a healthy alternative to refined sugar</span>.",
      vi: "Xin chào mọi người. Hôm nay chúng ta tìm hiểu một sản phẩm thực phẩm tự nhiên khác: siro cây phong. Chính xác đây là gì? Siro cây phong trông khá giống mật ong trong, nhưng không do ong làm ra; nó được sản xuất từ chất lưu thực vật – hay nhựa cây – bên trong cây phong, điều đó khiến nó là sản phẩm rất tự nhiên. Siro cây phong là chất lỏng sánh đặc, màu vàng óng, vị ngọt, có thể mua trong chai hoặc hũ, rưới lên món ăn như bánh waffle, kem hoặc dùng trong làm bánh. Nó không chứa chất bảo quản hay phụ gia và là lựa chọn lành mạnh thay cho đường tinh luyện." },
    { en: "Let's just talk a bit about the maple tree itself, which is where maple syrup comes from. So, there are many species of maple tree, and they'll grow without fertilizer in areas where there's plenty of moisture in the soil. However, they'll only do this if another important criterion is fulfilled, which is that they must have full or partial sun exposure during the day and very cool nights. There are only certain parts of the world that provide all these conditions: one is Canada, and by that, I mean all parts of Canada, and the other is the north-eastern states of North America. <span class='ev' id='d1p3b3-ev-q33'>In these areas, the climate suits the trees perfectly.</span> In fact, Canada produces over two-thirds of the world's maple syrup, which is why the five-pointed maple leaf is a Canadian symbol and has featured on the flag since 1964.",
      vi: "Hãy nói một chút về chính cây phong, nơi siro bắt nguồn. Có nhiều loài cây phong, chúng mọc mà không cần phân bón ở những vùng đất đủ ẩm. Tuy nhiên chúng chỉ làm được vậy nếu đáp ứng một tiêu chí quan trọng khác: phải có nắng toàn phần hoặc một phần vào ban ngày và đêm rất mát. Chỉ một số nơi trên thế giới có đủ điều kiện này: một là Canada – ý tôi là toàn bộ Canada – và nơi kia là các bang đông bắc Bắc Mỹ. Ở những vùng này, khí hậu phù hợp hoàn hảo với cây. Thực tế Canada sản xuất hơn hai phần ba lượng siro cây phong thế giới, đó là lý do lá phong năm cánh là biểu tượng Canada và xuất hiện trên quốc kỳ từ năm 1964." },
    { en: "So how did maple syrup production begin? Well, long before Europeans settled in these parts of the world, the indigenous communities had started producing maple sugar. They bored holes in the trunks of maple trees and used containers made of tree bark to collect the liquid sap as it poured out. As they were unable to keep the liquid for any length of time, they boiled the liquid by <span class='ev' id='d1p3b3-ev-q34'>placing pieces of rock that had become scorching hot from the sun into the sap</span>. They did this until it turned into sugar, and they were then able to use this to sweeten their food and drinks. Since that time, improvements have been made to the process, but it has changed very little overall.",
      vi: "Vậy việc sản xuất siro bắt đầu thế nào? Từ rất lâu trước khi người châu Âu định cư ở đây, các cộng đồng bản địa đã sản xuất đường cây phong. Họ khoan lỗ trên thân cây và dùng vật chứa làm bằng vỏ cây để hứng nhựa chảy ra. Vì không giữ được chất lỏng lâu, họ đun sôi bằng cách thả những hòn đá đã nung nóng rực dưới nắng vào nhựa cây. Họ làm vậy cho đến khi nó thành đường, rồi dùng để làm ngọt thức ăn và đồ uống. Từ đó quy trình có cải tiến nhưng nhìn chung thay đổi rất ít." },
    { en: "So let's look at the production of maple syrup today. Clearly, the maple forests are a valuable resource in many Canadian and North American communities. The trees have to be well looked after and they <span class='ev' id='d1p3b3-ev-q35'>cannot be used to make syrup until the trunks reach a diameter of around 25 centimetres. This can take anything up to 40 years.</span> As I've already mentioned, maple trees need the right conditions to grow and also to produce sap. What happens is that during a cold night, the tree absorbs water from the soil, and that rises through the tree's vascular system. But then in the warmer daytime, the change in temperature causes the water to be pushed back down to the bottom of the tree. This continual movement – up and down – leads to the formation of the sap needed for maple syrup production.",
      vi: "Hãy xem việc sản xuất siro ngày nay. Rừng phong là tài nguyên quý giá ở nhiều cộng đồng Canada và Bắc Mỹ. Cây phải được chăm sóc tốt và không dùng làm siro được cho đến khi thân đạt đường kính khoảng 25 cm. Việc này có thể mất tới 40 năm. Như đã nói, cây phong cần điều kiện thích hợp để phát triển và tạo nhựa. Trong đêm lạnh, cây hấp thụ nước từ đất và nước dâng lên qua hệ mạch. Nhưng ban ngày ấm hơn, thay đổi nhiệt độ đẩy nước trở xuống gốc. Sự di chuyển liên tục lên xuống này tạo ra nhựa cần cho sản xuất siro." },
    { en: "When the tree is ready, it can be tapped and this involves <span class='ev' id='d1p3b3-ev-q36'>drilling a small hole into the trunk and inserting a tube into it that ends in a bucket</span>. The trees can often take several taps, though the workers take care not to cause any damage to the healthy growth of the tree itself. The sap that comes out of the trees consists of 98 percent water and 2 percent sugar and other nutrients. It has to be boiled so that much of that water evaporates, and this process has to take place immediately, using what are called evaporators. These are basically extremely large pans – the sap is poured into these, <span class='ev' id='d1p3b3-ev-q37'>a fire is built and the pans are then heated until the sap boils</span>. As it does this, the water evaporates, and the syrup begins to form. <span class='ev' id='d1p3b3-ev-q38'>The evaporation process creates large quantities of steam</span>, and the sap becomes thicker and denser, and, at just the right moment, the worker removes it from the heat. After this process, something called 'sugar sand' has to be filtered out as this builds up during the boiling and <span class='ev' id='d1p3b3-ev-q39'>gives the syrup a cloudy appearance and a slightly gritty taste</span>. Once this has been done, the syrup is ready to be packaged. <span class='ev' id='d1p3b3-ev-q40'>It takes 40 litres of sap to produce one litre of maple syrup</span> so you can get an idea of how much is needed!",
      vi: "Khi cây sẵn sàng, người ta trích nhựa: khoan một lỗ nhỏ vào thân và chèn một ống dẫn có đầu nối vào xô. Cây thường chịu được nhiều lỗ trích, dù công nhân cẩn thận không gây hại cho sự phát triển của cây. Nhựa chảy ra gồm 98% nước và 2% đường cùng dưỡng chất. Nó phải được đun sôi để phần lớn nước bốc hơi, và quá trình này phải diễn ra ngay, dùng thiết bị gọi là nồi bốc hơi. Về cơ bản đó là những chiếc chảo cực lớn – nhựa được đổ vào, nhóm lửa và đun đến khi nhựa sôi. Khi đó nước bốc hơi và siro bắt đầu hình thành. Quá trình bốc hơi tạo ra lượng lớn hơi nước, nhựa trở nên sánh đặc hơn, và đúng thời điểm, công nhân nhấc ra khỏi lửa. Sau đó, chất gọi là 'cát đường' phải được lọc bỏ vì nó tích tụ khi đun và làm siro trông đục cùng vị hơi sạn. Xong việc này, siro sẵn sàng đóng gói. Phải mất 40 lít nhựa để làm ra một lít siro nên bạn có thể hình dung cần bao nhiêu!" },
    { en: "So that's the basic process. In places like Quebec where…", vi: "Đó là quy trình cơ bản. Ở những nơi như Quebec, nơi mà…" }
  ]
};

  transcript: [
    { en: "Good morning. Now, we've been asked to choose an aspect of European clothing or fashion and to talk about its development over time.",
      vi: "Chào buổi sáng. Chúng ta được yêu cầu chọn một khía cạnh của trang phục hoặc thời trang châu Âu và nói về sự phát triển của nó theo thời gian." },
    { en: "I decided to focus on a rather small area of clothing and that's pockets. I chose pockets for two reasons, really. We all have them – in jeans, jackets, coats, for example – and even though we often carry bags or briefcases as well, <span class='ev' id='d1p3b4-ev-q31'>nothing is quite as convenient as being able to pop your phone or credit card into your pocket</span>. Yet, I suspect that, other than that, people don't really think about pockets too much and they're rather overlooked as a fashion item.",
      vi: "Tôi quyết định tập trung vào một phần khá nhỏ của trang phục: túi quần áo. Tôi chọn túi vì hai lý do. Tất cả chúng ta đều có chúng – trong quần jeans, áo khoác ngắn, áo khoác dài – và dù thường mang túi xách hoặc cặp tài liệu, không gì tiện bằng việc nhét điện thoại hay thẻ tín dụng vào túi. Tuy nhiên, ngoài điều đó, tôi ngờ rằng mọi người không nghĩ nhiều về túi và chúng khá bị xem nhẹ như một món đồ thời trang." },
    { en: "It's certainly very interesting to go back in time and see how pockets developed for men and women. In the 18th century, fashions were quite different from the way they are now, and pockets were too. If we think about male fashion first … <span class='ev' id='d1p3b4-ev-q32'>that was the time when suits became popular</span>. Trousers were knee-length only and referred to as 'breeches', the waistcoats were short and the jackets were long, but all three garments were lined with material and <span class='ev' id='d1p3b4-ev-q33'>pockets were sewn into this cloth by whichever tailor the customer used</span>. The wearer could then carry small objects such as pencils or coins on their person and reach them through a gap in the lining. Coat pockets became increasingly decorative on the outside for men who wanted to look stylish, but they were often larger but plainer <span class='ev' id='d1p3b4-ev-q34'>if the wearer was someone with a profession who needed to carry medical instruments – a doctor or physician, for example</span>.",
      vi: "Thật thú vị khi ngược dòng thời gian xem túi phát triển thế nào với nam và nữ. Ở thế kỷ 18, thời trang khá khác bây giờ, và túi cũng vậy. Xét thời trang nam trước… đó là thời điểm bộ âu phục trở nên phổ biến. Quần chỉ dài đến gối và gọi là 'breeches', áo gile ngắn và áo khoác dài, nhưng cả ba loại đều được lót vải và túi được khâu vào lớp vải này bởi bất kỳ thợ may nào khách hàng thuê. Người mặc có thể mang vật nhỏ như bút chì, tiền xu và lấy ra qua khe hở ở lớp lót. Túi áo khoác ngày càng trang trí nhiều bên ngoài với những người muốn trông sành điệu, nhưng thường to hơn mà đơn giản hơn nếu người mặc là người có nghề chuyên môn cần mang dụng cụ y tế – ví dụ bác sĩ." },
    { en: "The development of women's pockets was a little different. For one thing, <span class='ev' id='d1p3b4-ev-q35'>they weren't nearly as visible or as easy to reach as men's</span>. In the 18th and 19th centuries, women carried numerous possessions on their person and some of these could be worth a lot of money. Women were more vulnerable to theft and wealthy women, in particular, worried constantly about pickpockets. So – what they did was to <span class='ev' id='d1p3b4-ev-q36'>have a pair of pockets made that were tied together with string</span>. The pockets were made of fabric, which might be recycled cloth if the wearer had little money or something more expensive, such as linen, sometimes featuring very delicate embroidery. <span class='ev' id='d1p3b4-ev-q37'>Women tied the pockets around their waist so that they hung beneath their clothes.</span> Remember, skirts were long then and there was plenty of room to hide a whole range of small possessions between the layers of petticoats that were commonly worn. They would have an opening in the folds of their skirts <span class='ev' id='d1p3b4-ev-q38'>through which they could reach whatever they needed, like their perfume</span>. Working women, of course, also needed to carry around items that they might use for whatever job or trade they were involved in, but their pairs of pockets still remained on the inside of their clothing, they just got bigger or longer sometimes reaching down to their knees!",
      vi: "Sự phát triển túi của phụ nữ hơi khác. Trước hết, chúng không dễ nhìn thấy hay dễ thò tay vào như túi nam. Ở thế kỷ 18 và 19, phụ nữ mang nhiều đồ đạc trên người và một số rất giá trị. Phụ nữ dễ bị trộm hơn, đặc biệt phụ nữ giàu luôn lo về nạn móc túi. Vì vậy họ đặt may một cặp túi buộc với nhau bằng dây. Túi làm bằng vải, có thể là vải tái chế nếu ít tiền hoặc chất liệu đắt hơn như vải lanh, đôi khi có đường thêu tinh xảo. Phụ nữ buộc túi quanh eo để chúng treo bên dưới lớp quần áo. Váy thời đó rất dài và có nhiều khoảng trống để giấu đồ giữa các lớp váy lót. Họ có một khe mở ở nếp gấp váy để thò tay lấy bất cứ thứ gì cần, như nước hoa. Phụ nữ lao động cũng cần mang vật dụng cho công việc, nhưng cặp túi vẫn nằm bên trong quần áo, chỉ to hơn hoặc dài hơn, đôi khi xuống tận đầu gối!" },
    { en: "So the tie-on pockets went well into the 19th century and only changed when fashion altered towards the end of that period. That's when dresses became tighter and less bulky, and the pairs of pockets became very noticeable – <span class='ev' id='d1p3b4-ev-q39'>they stood out too much and detracted from the woman's image</span>. Women who had been used to carrying around a range of personal possessions – and still wanted to – needed somewhere to carry these items about their person. That was when small bags, or pouches as they were known, came into fashion and, of course, <span class='ev' id='d1p3b4-ev-q40'>they inevitably led on to the handbag of more modern times</span>, particularly when fashion removed pockets altogether.",
      vi: "Loại túi buộc dây kéo dài sang thế kỷ 19 và chỉ thay đổi khi thời trang biến đổi vào cuối thời kỳ đó. Đó là khi váy trở nên bó sát và bớt phồng, và cặp túi trở nên rất dễ thấy – chúng nhô ra quá nhiều và làm giảm hình ảnh của người phụ nữ. Phụ nữ vốn quen mang nhiều đồ cá nhân – và vẫn muốn vậy – cần nơi để mang chúng. Đó là khi những chiếc túi nhỏ, hay pouch, trở thành mốt và tất nhiên chúng dẫn tới túi xách của thời hiện đại, đặc biệt khi thời trang loại bỏ hoàn toàn túi quần áo." }

    quiz: [

        vi: "'Sẽ là…' — mô tả điều giả định, chưa tồn tại." },

  transcript: [
    { en: "In today's astronomy lecture, I'm going to talk about the need for a system to manage the movement of satellites and other objects in orbit around the Earth. In other words, a Space Traffic Management system. We already have effective Air Traffic Control systems that are used internationally to ensure that planes navigate our skies safely. Well, Space Traffic Management is a similar concept, but focusing on the control of satellites.",
      vi: "Trong bài giảng thiên văn hôm nay, tôi sẽ nói về sự cần thiết của một hệ thống quản lý chuyển động của vệ tinh và các vật thể khác trên quỹ đạo quanh Trái Đất. Nói cách khác, một Hệ thống Quản lý Giao thông Vũ trụ. Chúng ta đã có hệ thống Kiểm soát Không lưu hiệu quả dùng trên phạm vi quốc tế để đảm bảo máy bay di chuyển an toàn. Quản lý Giao thông Vũ trụ là khái niệm tương tự, nhưng tập trung vào kiểm soát vệ tinh." },

    { en: "But unfortunately, at present we don't actually have a Space Traffic Management system that works. So why not? What are the problems in developing such a system?",
      vi: "Nhưng không may, hiện tại chúng ta chưa có Hệ thống Quản lý Giao thông Vũ trụ nào hoạt động. Vậy tại sao? Những khó khăn trong việc phát triển hệ thống như vậy là gì?" },
    { en: "Well, for one thing, <span class='ev' id='d1p3b5-ev-q32'>satellites are relatively cheap these days, compared with how they were in the past</span>, meaning that more people can afford to put them into space. So there's a lot more of them out there, and people aren't just launching single satellites but <span class='ev' id='d1p3b5-ev-q33'>whole constellations, consisting of thousands of them designed to work together</span>. So space is getting more crowded every day.",
      vi: "Một lý do là vệ tinh ngày nay tương đối rẻ so với trước đây, nghĩa là nhiều người có khả năng đưa chúng vào vũ trụ. Vì vậy có nhiều vệ tinh hơn ngoài đó, và người ta không chỉ phóng từng vệ tinh đơn lẻ mà cả những chòm vệ tinh gồm hàng ngàn cái được thiết kế hoạt động cùng nhau. Không gian ngày càng chật chội." },
    { en: "But in spite of this, one thing you may be surprised to learn is that you can launch a satellite into space and, once it's out there, <span class='ev' id='d1p3b5-ev-q34'>it doesn't have to send back any information to Earth to allow its identification</span>. So while we have international systems for ensuring we know where the planes in our skies are, and to prevent them from colliding with one another, when it comes to the safety of satellites, at present <span class='ev' id='d1p3b5-ev-q35'>we don't have anything like enough proper ways of tracking them</span>.",
      vi: "Dù vậy, điều có thể khiến bạn ngạc nhiên là bạn có thể phóng một vệ tinh và khi nó đã ở ngoài đó, nó không bắt buộc phải gửi thông tin nào về Trái Đất để phục vụ nhận dạng. Trong khi ta có hệ thống quốc tế đảm bảo biết vị trí máy bay và ngăn chúng va nhau, thì với an toàn vệ tinh, hiện chưa có đủ phương pháp thích hợp để theo dõi chúng." },
    { en: "And it isn't just entire satellites that we need to consider. A greater threat is the huge amount of space debris in orbit around the Earth – broken bits of satellite and junk from space stations and so on. And some of these are so small that they can be very hard to identify, but they can still be very dangerous.",
      vi: "Và không chỉ vệ tinh nguyên vẹn là điều cần xem xét. Mối đe dọa lớn hơn là lượng rác vũ trụ khổng lồ trên quỹ đạo – mảnh vỡ vệ tinh và rác từ trạm vũ trụ. Một số mảnh nhỏ đến mức rất khó nhận dạng nhưng vẫn rất nguy hiểm." },

      vi: "Ngoài ra, một số đơn vị vận hành có thể không sẵn lòng chia sẻ thông tin về vệ tinh họ đã phóng. Ví dụ, vệ tinh có thể được thiết kế cho mục đích quân sự, hoặc được phóng vì lý do thương mại, và họ không muốn đối thủ có thông tin về nó." },
    { en: "And even if the operators are willing to provide it, the information isn't easy to collect. <span class='ev' id='d1p3b5-ev-q37'>Details are needed about the object itself, as well as about its location at a particular time</span> – and remember that a satellite isn't very big, and it's likely to be moving at thousands of kilometres an hour. We don't have any sensors that can constantly follow something moving so fast, so <span class='ev' id='d1p3b5-ev-q38'>all that the scientists can do is to put forward a prediction concerning where the satellite is heading next</span>.",
      vi: "Và ngay cả khi họ sẵn sàng cung cấp, thông tin cũng không dễ thu thập. Cần chi tiết về bản thân vật thể, cũng như vị trí của nó tại một thời điểm cụ thể – và nhớ rằng vệ tinh không lớn, lại di chuyển hàng ngàn km mỗi giờ. Chúng ta không có cảm biến nào theo dõi liên tục vật thể nhanh như vậy, nên tất cả những gì nhà khoa học có thể làm là đưa ra dự đoán về nơi vệ tinh sẽ hướng tới tiếp theo." },
    { en: "So those are some of the problems that we're facing. Let's consider now some of the solutions that have been suggested. One key issue is the way in which information is dealt with. We need more information, but it also needs to be accessible at a global level, so we need to establish shared standards that we can all agree on for the way in which this information is presented. We already do this in other areas of science, so although this is a challenge, it's not an impossible task. Then, as all this information's collected, it needs to be put together so it can be used, and <span class='ev' id='d1p3b5-ev-q39'>that will involve creating a single database on which it can be entered</span>.",
      vi: "Đó là một số vấn đề chúng ta đang đối mặt. Giờ hãy xem một số giải pháp đã được đề xuất. Vấn đề then chốt là cách xử lý thông tin. Ta cần nhiều thông tin hơn, nhưng cũng cần tiếp cận được ở cấp toàn cầu, nên cần thiết lập tiêu chuẩn chung được thống nhất về cách trình bày thông tin. Ta đã làm điều này ở các lĩnh vực khoa học khác, nên dù là thách thức, đó không phải nhiệm vụ bất khả thi. Sau đó, khi thông tin được thu thập, nó cần được tổng hợp để sử dụng, và điều đó bao gồm việc tạo ra một cơ sở dữ liệu duy nhất để nhập vào." },
    { en: "As we continue to push forward new developments, congestion of the space environment is only going to increase. To cope with this, we need to develop a system like the one I've described to coordinate the work of the numerous spacecraft operators, but it's also essential that <span class='ev' id='d1p3b5-ev-q40'>this system is one that establishes trust in the people that use it</span>, both nationally and at a global level. One interesting development…",
      vi: "Khi chúng ta tiếp tục thúc đẩy các bước phát triển mới, sự tắc nghẽn môi trường vũ trụ sẽ chỉ tăng lên. Để ứng phó, ta cần phát triển một hệ thống như tôi đã mô tả để phối hợp công việc của nhiều đơn vị vận hành, nhưng cũng thiết yếu là hệ thống này phải tạo dựng được niềm tin nơi những người sử dụng nó, cả ở cấp quốc gia và toàn cầu. Một bước phát triển thú vị…" }

/* ---------- Register Practice 3 ---------- */
PRACTICES.d1p3 = {
  id: "d1p3",
  title: "Part 4 · Note Completion (Cam 17–18)",
  bais: [BAI_D1P3B1, BAI_D1P3B2, BAI_D1P3B3, BAI_D1P3B4, BAI_D1P3B5]
